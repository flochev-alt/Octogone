# Cherche une photo libre de droits pour chaque combattant et enregistre public/photos.json.
# Chaque lundi, quand le script change, ou à la main (Actions > Photos combattants > Run workflow).
# Les photos sont cherchées ici, et non par le site, car Wikipédia bloque les requêtes venant de Vercel.
name: Photos combattants

on:
  schedule:
    - cron: "30 4 * * 1"
  push:
    paths:
      - scripts/fetch-photos.mjs
      - .github/workflows/fetch-photos.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-photos
  cancel-in-progress: true

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Chercher les photos
        run: node scripts/fetch-photos.mjs
      - name: Enregistrer
        run: |
          git add public/photos.json
          if git diff --cached --quiet; then echo "Aucun changement."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Photos combattants : mise à jour automatique"
          # La branche a pu avancer pendant la recherche : on se replace dessus avant d'envoyer.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
      # Planche contact (miniatures + noms) pour vérifier d'un coup d'œil qu'aucune photo ne montre
      # quelqu'un d'autre : Actions > le run > Artifacts > planche-photos.
      - name: Planche contact
        if: always()
        run: |
          mkdir -p planche
          node -e '
            const p = require("./public/photos.json");
            for (const [n, v] of Object.entries(p)) {
              const f = decodeURIComponent(v.page.split("File:")[1]);
              console.log(n.replace(/[^A-Za-z0-9]+/g, "_") + "\t" + "https://commons.wikimedia.org/wiki/Special:FilePath/" + encodeURIComponent(f) + "?width=240");
            }' > planche/list.tsv
          while IFS=$'\t' read -r name url; do
            curl -sfL -A "OctogonePhotos/1.0 (https://octogone.space)" -o "planche/$name.jpg" "$url" || true
            sleep 0.3
          done < planche/list.tsv
          montage -label '%t' -geometry 160x200+4+4 -tile 10x -pointsize 11 planche/*.jpg planche/planche.jpg || true
          # Copie aussi la planche sur la branche controle-photos (consultable sans télécharger d'artefact).
          if [ -f planche/planche.jpg ]; then
            cd planche && git init -q -b controle-photos && git add planche.jpg list.tsv
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Planche contact photos"
            git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" controle-photos
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: planche-photos
          path: planche/planche.jpg
          if-no-files-found: ignore
